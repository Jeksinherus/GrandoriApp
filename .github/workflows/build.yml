name: Build Grandoria APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q GrandoriaApp_Fixed_GitHubActions.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find project
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk output/Grandoria.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grandoria-apk
          path: output/Grandoria.apk